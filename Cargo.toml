[workspace]
resolver = "2"
# The fuzz targets need nightly, so they are not part of the normal build.
exclude = ["fuzz"]
members = [
    "crates/zerotrace-core",
    "crates/zerotrace-secure-memory",
    "crates/zerotrace-kdf",
    "crates/zerotrace-crypto",
    "crates/zerotrace-compress",
    "crates/zerotrace-format",
    "crates/zerotrace-auth",
    "crates/zerotrace-presence",
    "crates/zerotrace-policy",
    "crates/zerotrace-journal",
    "crates/zerotrace-sanitize",
    "crates/zerotrace-destroy",
    "crates/zerotrace-ipc",
    "crates/zerotrace-platform",
    "crates/zerotrace-enterprise",
    "crates/zerotrace-split",
    "crates/zerotrace-remote",
    "crates/zerotrace-audit",
    "crates/zerotrace-vault",
    "apps/zerotrace-cli",
    "apps/zerotrace-service",
    "apps/zerotrace-desktop",
]

[workspace.package]
version = "0.18.6"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
zeroize = { version = "1.7", features = ["derive"] }
rand = "0.8"
uuid = { version = "1.10", features = ["v4", "serde"] }
sha2 = "0.10"
hkdf = "0.12"
subtle = "2.5"

[profile.release]
overflow-checks = true
